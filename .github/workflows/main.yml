import streamlit as st
import numpy as np
import matplotlib.pyplot as plt

# --- Title ---
st.title("Cosmological Area Evolution")

# --- Slider (your key parameter) ---
w = st.slider("Equation of State (w)", -1.2, 0.5, -1.0, step=0.01)

# --- Time domain ---
t = np.linspace(0.1, 10, 500)

# --- Your physics function ---
def area_evolution(t, w):
    # 🔴 REPLACE THIS with your real solution
    a = t**(2 / (3 * (1 + w)))  # placeholder
    A = a**2
    return A

# --- Compute ---
A = area_evolution(t, w)

# --- Plot ---
fig, ax = plt.subplots()
ax.plot(t, A, label=f"w = {w}")
ax.set_xlabel("Cosmological Time")
ax.set_ylabel("Area")
ax.legend()

st.pyplot(fig)

# --- Interpretation ---
if w < -1/3:
    st.success("Accelerating universe (thermodynamic / dark energy dominated)")
else:
    st.info("Decelerating universe (gravity dominated)")
